# libera manifest
# ==============================================================================

[lib]
path = "src/_.rs"
bench = false

[package]
name = "libera"
description = "A liberating activation of potential."
repository = "https://github.com/andamira/libera"
documentation = "https://docs.rs/libera"
rust-version = "1.99.0" # in sync with CI when added
edition = "2024"
version = "0.1.0-wip"
authors = ["José Luis Cruz <joseluis@andamira.net>"]
license = "MIT OR Apache-2.0"
categories = []
keywords = []
autoexamples = false
autobenches = false
publish = true
include = [
    "/Cargo.toml",
    "/src/**/*.rs", "/src/**/*.md",
    "/LICENSE*",
]

[package.metadata.docs.rs]
no-default-features = true
features = ["_docs"]

[features]
# Development
__dbg = []
__publish = ["devela/__publish"]
__docs_internal = []

# Environment
alloc = ["devela/alloc"]
std = ["alloc", "devela/std"]
no_std = ["devela/no_std"]

# Modules
all = []

# Safety
safest = ["safe", "devela/safe"]
safe = []
unsafe = []
unsafest = ["unsafe", "devela/unsafe"]

# Documentation
_docs_min = ["std", "unsafe"]
_docs = ["_docs_min"]

[dependencies.devela]
version = "0.30.0"
# path = "../devela"
default-features = false

[badges]
maintenance = { status = "experimental" }

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    "cfg(nightly)",
    "cfg(nightly_unstable)",
    "cfg(nightly_doc)",
]
